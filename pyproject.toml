[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-tools-workspace"
version = "0.1.0"
description = "tg-tools root Python dependency workspace"
requires-python = ">=3.12"
dependencies = [
    "anyio==4.14.2",
    "certifi==2026.10.19",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "iniconfig==2.3.0",
    "packaging==26.2",
    "pluggy==1.6.0",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "pyaes==1.6.1",
    "pyasn1==0.6.5",
    "Pygments==2.20.0",
    "pytest==9.1.1",
    "python-telegram-bot==22.8",
    "rsa==4.9.1",
    "Telethon==1.45.0",
    "typing_extensions==4.16.0",
]

[tool.setuptools]
packages = []

# Checkout packaging validator invokes python -m pip; not a service dependency.
[tool.tg-tools]
bootstrap-dependencies = ["pip==26.2.2"]

[tool.uv.workspace]
members = ["shared"]
