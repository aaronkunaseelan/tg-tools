# Replace runtime-controller.example.com with the real hostname.
# Ensure nginx and certificate paths exist before enabling.

upstream runtime_controller_upstream {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name runtime-controller.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name runtime-controller.example.com;

    ssl_certificate     /etc/letsencrypt/live/runtime-controller.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runtime-controller.example.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass http://runtime_controller_upstream;
    }
}
