# Live-style nginx config for this OCI host when you want the runtime-controller
# reachable from localhost and Tailscale only, without broad public exposure.
#
# Current runtime app remains on 127.0.0.1:8787.
# nginx listens on port 80 and only allows localhost + 100.64.0.0/10.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10m;

    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        allow 100.64.0.0/10;
        deny all;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_pass http://127.0.0.1:8787/healthz;
    }

    location / {
        allow 127.0.0.1;
        allow ::1;
        allow 100.64.0.0/10;
        deny all;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8787;
    }
}
